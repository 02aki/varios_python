<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Roles</title>
</head>
<body>
    <h1>Preguntas sobre Roles en Scrum</h1>
    <p>{{ role.question }}</p>
    
    <form method="POST">
        <input type="text" name="answer" placeholder="Tu respuesta" required>
        <button type="submit">Enviar</button>
    </form>

    {% if response %}
        <p>{{ response }}</p>
    {% endif %}
</body>
</html>
