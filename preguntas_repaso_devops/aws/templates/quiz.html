<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de databases aws</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        input, button { margin-top: 10px; padding: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Escribe el nombre de la db correcta</h2>
        <p><strong>Descripción:</strong> {{ db['description'] }}</p>
        
        <form method="POST">
            <input type="text" name="answer" placeholder="Escribe el nombre de la db aquí" required>
            <br>
            <button type="submit">Enviar respuesta</button>
        </form>
        
        {% if response %}
            <p><strong>{{ response }}</strong></p>
        {% endif %}
    </div>
</body>
</html>
