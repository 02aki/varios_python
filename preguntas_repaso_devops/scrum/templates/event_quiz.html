<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Eventos de Scrum</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .box { border: 2px solid #333; padding: 20px; min-width: 250px; min-height: 50px; background-color: #f4f4f4; }
        .draggable { padding: 10px; background-color: #007bff; color: white; cursor: grab; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Arrastra cada evento de Scrum a su descripción correcta</h1>
    <div class="container">
        <div id="events" class="box">
            <h3>Eventos</h3>
            {% for event in events %}
                <div class="draggable" draggable="true" id="{{ event.event }}">{{ event.event }}</div>
            {% endfor %}
        </div>

        <div id="descriptions" class="box">
            <h3>Descripciones</h3>
            {% for event in events %}
                <div class="dropzone" data-event="{{ event.event }}" style="border: 1px dashed #333; padding: 10px; margin-bottom: 10px;">
                    {{ event.description }}
                </div>
            {% endfor %}
        </div>
    </div>

    <button onclick="submitAnswers()">Enviar Respuestas</button>

    <p id="feedback"></p>

    <script>
        let draggedItem = null;
    
        // Manejar eventos de arrastre
        document.querySelectorAll('.draggable').forEach(item => {
            item.addEventListener('dragstart', (event) => {
                draggedItem = event.target;
            });
        });
    
        // Permitir soltar elementos en los dropzones
        document.querySelectorAll('.dropzone').forEach(zone => {
            zone.addEventListener('dragover', (event) => {
                event.preventDefault();
            });
    
            zone.addEventListener('drop', (event) => {
                event.preventDefault();
                if (!zone.hasChildNodes()) {
                    zone.appendChild(draggedItem);
                    draggedItem.style.backgroundColor = ""; // Resetear color al arrastrar
                }
            });
        });
    
        // Función para enviar respuestas
        function submitAnswers() {
            let answers = {};
            document.querySelectorAll('.dropzone').forEach(zone => {
                if (zone.hasChildNodes()) {
                    answers[zone.dataset.event] = zone.firstChild.id;
                }
            });
    
            fetch('/events', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers: answers })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("feedback").innerText = data.message;
    
                // Actualizar los colores de las respuestas
                document.querySelectorAll('.dropzone').forEach(zone => {
                    if (zone.hasChildNodes()) {
                        let eventKey = zone.dataset.event;
                        let eventDiv = zone.firstChild;
    
                        if (data.event_results[eventKey]) {
                            eventDiv.style.backgroundColor = 'green';  // Correcto
                        } else {
                            eventDiv.style.backgroundColor = 'red';  // Incorrecto
                        }
                    }
                });
            });
        }
    
        // Restaurar respuestas previas si existen
        window.onload = function() {
            let userAnswers = {{ user_answers | tojson }};
            let eventResults = {{ event_results | tojson }};
    
            document.querySelectorAll('.dropzone').forEach(zone => {
                let eventKey = zone.dataset.event;
                if (userAnswers[eventKey]) {
                    let eventDiv = document.getElementById(userAnswers[eventKey]);
                    if (eventDiv) {
                        zone.appendChild(eventDiv);
                        eventDiv.style.backgroundColor = eventResults[eventKey] ? 'green' : 'red';
                    }
                }
            });
        };
    </script>
