{% extends "base.html" %}

{% block content %}
    <h2>Pregunta sobre scrum</h2>
    <p><strong>Pregunta:</strong> {{ question['question'] }}</p>
    
    <form method="POST">
        <input type="text" name="answer" placeholder="Escribe tu respuesta aquí" required>
        <br>
        <button type="submit">Enviar respuesta</button>
    </form>

    {% if response %}
        <p class="message">{{ response }}</p>
    {% endif %}
{% endblock %}
