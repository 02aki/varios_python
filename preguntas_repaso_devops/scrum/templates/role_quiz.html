<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Roles</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Preguntas sobre Roles</h1>
        <p><strong>{{ role.question }}</strong></p>

        <form method="post">
            <input type="text" name="answer" placeholder="Escribe tu respuesta" required>
            <button type="submit">Responder</button>
        </form>

        {% if response %}
            <p>{{ response }}</p>
        {% endif %}
    </div>
</body>
</html>
